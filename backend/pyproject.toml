[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-ai-news-agent"
version = "1.0.0"
description = "Auditable LangGraph + DeepSeek daily news agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "langgraph>=1.0,<2", "openai>=1.60,<3", "httpx>=0.28,<1",
  "feedparser>=6.0,<7", "beautifulsoup4>=4.12,<5", "urllib3>=2.3,<3",
  "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3", "tzdata>=2025.1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
