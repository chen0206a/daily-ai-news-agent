name: quality
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e './backend[dev]'
      - run: pytest backend/tests -q
      - run: ruff check backend scripts
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser tests against real local services (no LLM calls)
        shell: bash
        run: |
          uvicorn app.api:app --host 127.0.0.1 --port 8000 --workers 1 > /tmp/news-api.log 2>&1 &
          (cd frontend && npm run start) > /tmp/news-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000 > /dev/null && curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then break; fi
            sleep 1
          done
          cd frontend
          npm run test:e2e
